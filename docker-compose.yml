version: '3.8'
services:
  app:
    build: .
    container_name: ispa-app
    restart: unless-stopped
    ports: ["8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=ispa_cyber_academy
      - DB_USERNAME=root
      - DB_PASSWORD=secret
  mysql:
    image: mysql:8.0
    container_name: ispa-mysql
    restart: unless-stopped
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ispa_cyber_academy
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ispa-phpmyadmin
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: secret
    depends_on: [mysql]
volumes:
  mysql_data:
